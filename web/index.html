<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKWasm</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px/1.4 system-ui, sans-serif; }
  /* SDL owns the canvas size (window size x devicePixelRatio); CSS sizing here would make
     SDL, ImGui and the WebGPU surface disagree about it. */
  #canvas { display: block; margin: 0 auto; outline: none; }
  /* In fill-document mode (position: fixed, set by SDL) the canvas always covers the viewport.
     SDL only rewrites the CSS size when devicePixelRatio != 1, so a zoom change back to 100%
     would otherwise leave a stale size behind; the backing store already tracks the viewport. */
  #canvas[style*="position: fixed"] { width: 100vw !important; height: 100vh !important; }
  #play { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 18px; background: #0009; color: #fff; font: 600 20px/1.4 system-ui, sans-serif; cursor: pointer; z-index: 2; }
  #play table { font: 400 14px/1.5 system-ui, sans-serif; border-spacing: 14px 2px; color: #ddd; }
  #play td:first-child { text-align: right; color: #fff; font-weight: 600; }
  #play p { margin: 0; font: 400 13px/1.4 system-ui, sans-serif; color: #aaa; }
  #status { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; background: #000a; border-radius: 4px; white-space: pre-wrap; max-width: 80vw; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading…</div>
<script>
  // Keep the runtime's output for inspection (window.mkwLog) alongside the console.
  window.mkwLog = [];
  window.mkwLogTimes = [];  // performance.now() per line, for lining logs up with profiles
  // Dev aid: mirror the log to the local dev server (web/serve.mjs writes web-run.log).
  if (['localhost', '127.0.0.1'].includes(location.hostname)) {
    let posted = 0;
    setInterval(() => {
      if (mkwLog.length === posted) return;
      posted = mkwLog.length;
      fetch('/__log', {method: 'POST', body: mkwLog.join('\n')}).catch(() => {});
    }, 2000);
  }
  // Dev aid (?stream): send each line with a synchronous XHR, which completes even when the
  // page's main thread never yields again (beacons and fetches would stay queued).
  const streamEnabled = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).has('stream');
  const postSync = (url, body) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, false);
    try { xhr.send(body); } catch {}
  };
  const streamLog = streamEnabled ? (text) => postSync('/__logline', text + '\n') : () => {};
  if (streamEnabled) postSync('/__logreset', '');
  const statusEl = document.getElementById('status');
  const setStatus = (text) => { statusEl.textContent = text; statusEl.hidden = !text; };

  const missing = [];
  if (!('gpu' in navigator)) missing.push('WebGPU');
  if (!('Suspending' in WebAssembly)) missing.push('WebAssembly JSPI');
  if (missing.length) {
    setStatus(`This browser lacks ${missing.join(' and ')}. Use a current Chrome or Edge.`);
    throw new Error('unsupported browser');
  }

  const DVD_ROOT = '/dvd';
  // Automated dev runs (?autorace, ?autokeys) press through menus, which creates licences and
  // writes saves; they get their own IndexedDB store so the player's saves stay untouched.
  const AUTOMATED = ['autorace', 'autokeys', 'autowfc', 'autoidle'].some((name) => new URLSearchParams(location.search).has(name));
  const DATA_HOME = AUTOMATED ? '/userdata-dev' : '/userdata';
  const CONFIG = `# WiiCompiled web configuration
[video]
widescreen = true
resolution_multiplier = 1.0
frame_interpolation_fps = 0
display_mode = "windowed"
graphics_api = "auto"
show_fps = true

[audio]
mix_worker = false

[network]
enabled = false

[discord]
enabled = false

[paths]
dvd_root = "${DVD_ROOT}"
`;

  // Mirrors MEMFS changes under DATA_HOME back to IndexedDB. A sync scans and re-stores
  // changed files on the main thread, so it runs only after the game wrote its NAND (saves
  // happen at menus and after races) and whenever the tab is hidden or closed. The pipeline
  // cache database, which changes constantly, rides along with those syncs.
  let userDataSyncing = false;
  let userDataDirty = false;
  const persistUserData = () => {
    if (userDataSyncing || typeof FS === 'undefined') return;
    userDataSyncing = true;
    userDataDirty = false;
    FS.syncfs(false, (error) => {
      userDataSyncing = false;
      if (error) console.warn('Saving user data failed:', error);
    });
  };
  const startUserDataSync = () => {
    const nandRoot = `${DATA_HOME}/WiiCompiled/NAND/`;
    const write = FS.write;
    FS.write = function (stream, ...args) {
      if (stream?.path?.startsWith(nandRoot)) userDataDirty = true;
      return write.call(this, stream, ...args);
    };
    setInterval(() => { if (userDataDirty) persistUserData(); }, 2000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persistUserData(); });
    window.addEventListener('pagehide', persistUserData);
  };

  var Module = {
    canvas: document.getElementById('canvas'),
    mkwDvdRoot: DVD_ROOT,
    mkwGameUrl: 'game',
    // Files warmed into the disc cache in the background (random-access reads at race start).
    mkwPrefetch: ['files/sound/revo_kart.brsar'],
    // Dev aid: ?prefetchDelay=ms overrides when the prefetch starts (default 15 s after boot).
    mkwPrefetchDelayMs: ['localhost', '127.0.0.1'].includes(location.hostname) &&
        new URLSearchParams(location.search).has('prefetchDelay')
      ? Number(new URLSearchParams(location.search).get('prefetchDelay')) : undefined,
    locateFile: (name) => `build/${name}`,
    print: (text) => { mkwLog.push(text); mkwLogTimes.push(performance.now()); streamLog(text); console.log(text); },
    printErr: (text) => { mkwLog.push(text); mkwLogTimes.push(performance.now()); streamLog(text); console.warn(text); },
    setStatus: (text) => setStatus(text),
    preRun: [() => {
      // Game files stay on the server and are range-read on demand (mkw_web_read_file);
      // only the disc's file table and the directory skeleton live in MEMFS.
      ENV.XDG_DATA_HOME = DATA_HOME;
      // User data (Config.toml, NAND saves and licences, pipeline cache) lives in IndexedDB.
      FS.mkdirTree(DATA_HOME);
      FS.mount(IDBFS, {}, DATA_HOME);
      addRunDependency('userdata');
      FS.syncfs(true, (error) => {
        if (error) console.warn('Loading saved user data failed:', error);
        FS.mkdirTree(`${DATA_HOME}/WiiCompiled`);
        const configPath = `${DATA_HOME}/WiiCompiled/Config.toml`;
        if (!FS.analyzePath(configPath).exists) FS.writeFile(configPath, CONFIG);
        // ?online turns on the guest network stack (sockets go through the page's network
        // gateway, /__net on the dev server). It stays on for later visits until ?online=0.
        const online = new URLSearchParams(location.search).get('online');
        if (online !== null) {
          const text = FS.readFile(configPath, {encoding: 'utf8'});
          FS.writeFile(configPath, text.replace(/(\[network\][^\[]*?enabled\s*=\s*)(true|false)/,
                                                `$1${online === '0' ? 'false' : 'true'}`));
        }
        startUserDataSync();
        removeRunDependency('userdata');
      });
      FS.mkdirTree(`${DVD_ROOT}/sys`);
      FS.mkdirTree(`${DVD_ROOT}/files`);
      addRunDependency('fst');
      fetch('game/sys/fst.bin')
        .then((r) => { if (!r.ok) throw new Error(`fst.bin: HTTP ${r.status}`); return r.arrayBuffer(); })
        .then((buffer) => {
          FS.writeFile(`${DVD_ROOT}/sys/fst.bin`, new Uint8Array(buffer));
          removeRunDependency('fst');
        })
        .catch((e) => setStatus(`Failed to load the disc file table: ${e}`));
    }],
    onRuntimeInitialized: () => setStatus(''),
    onAbort: (what) => setStatus(`Aborted: ${what}`),
  };
  const describe = (e) => {
    if (e instanceof WebAssembly.Exception && Module.getExceptionMessage) {
      try { return Module.getExceptionMessage(e).join(': '); } catch {}
    }
    return e?.stack ?? e?.message ?? String(e);
  };
  // SDL's fill-document mode moves everything else on the page into a hidden container.
  // Bring the status line back, and ask for a click: keyboard input needs the canvas focused
  // and browsers only start audio after a user gesture.
  new MutationObserver((_, observer) => {
    if (!document.getElementById('SDL3_fill_document_background_elements')) return;
    observer.disconnect();
    statusEl.style.zIndex = 3;
    document.body.appendChild(statusEl);
    const play = document.createElement('div');
    play.id = 'play';
    // Keyboard defaults from aurora's pad.cpp (used when no gamepad is connected).
    const controls = [
      ['Arrow keys', 'Steer / menus'], ['X', 'Accelerate, confirm (A)'], ['Z', 'Brake, back (B)'],
      ['Space', 'Drift / hop (R)'], ['Q', 'Use item (L)'], ['T', 'Trick (D-pad up)'], ['Enter', 'Pause (Start)'],
    ];
    play.innerHTML = '<div>Click to play</div><table>' +
      controls.map(([key, action]) => `<tr><td>${key}</td><td>${action}</td></tr>`).join('') +
      '</table><p>A connected gamepad is used automatically.</p>';
    play.addEventListener('pointerdown', () => {
      play.remove();
      Module.canvas.focus();
    }, {once: true});
    document.body.appendChild(play);
  }).observe(document.body, {childList: true});
  // Dev aids, no clicks needed; progress goes to the log as [autorace] lines.
  //   ?autorace[=seconds]  drive the menus into a Grand Prix race and hold accelerate for the
  //                        given time (default 40 s); a menu that stops responding gets a thread
  //                        dump and a B press.
  //   ?autokeys=x,x,down,x play a key sequence (x z up down left right enter, or wait), one key
  //                        every ~1.8 s, logging the menu section/page before each.
  //   &click               with any of these: wait for a real click first, so audio runs.
  //   &soak[=seconds]       with ?autorace: keep racing (default 30 min), logging memory.
  //   ?autoidle[=seconds]  no input: attract-mode demo races cycle courses (default 30 min),
  //                        logging memory; a long-session check for leaks and crashes.
  //   ?autowfc[=presses]   go to Nintendo WFC from the main menu and keep confirming prompts
  //                        (default 12 presses), logging every page; pair it with ?online.
  if (['localhost', '127.0.0.1'].includes(location.hostname) &&
      ['autorace', 'autokeys', 'autowfc', 'autoidle'].some((name) => new URLSearchParams(location.search).has(name))) {
    const params = new URLSearchParams(location.search);
    const raceSeconds = Number(params.get('autorace')) || 40;
    const say = (text) => Module.print(`[autorace] ${text}`);
    // Timers come from a worker: Chrome throttles a hidden or occluded page's own timers to
    // one wake-up a minute, which froze the autopilot whenever its window was not in front.
    const ticker = new Worker(URL.createObjectURL(new Blob(
        ['setInterval(() => postMessage(0), 50);'], {type: 'text/javascript'})));
    const tickWaiters = [];
    ticker.onmessage = () => {
      const now = performance.now();
      for (let i = tickWaiters.length - 1; i >= 0; i--) {
        if (now >= tickWaiters[i].at) tickWaiters.splice(i, 1)[0].resolve();
      }
    };
    const sleep = (ms) => new Promise((resolve) => tickWaiters.push({at: performance.now() + ms, resolve}));
    const key = (code, down) => {
      const keyName = {KeyX: 'x', KeyZ: 'z'}[code] ?? code;
      const event = new KeyboardEvent(down ? 'keydown' : 'keyup', {key: keyName, code, bubbles: true, cancelable: true});
      Module.canvas.dispatchEvent(event);
    };
    const press = async (code, holdMs = 200) => { key(code, true); await sleep(holdMs); key(code, false); };
    const seen = (text) => mkwLog.some((line) => line.includes(text));
    (async () => {
      while (!document.getElementById('play')) await sleep(250);
      // &click: wait for one real click on the overlay, the user gesture audio needs to start.
      if (params.has('click')) {
        say('waiting for a click');
        while (document.getElementById('play')) await sleep(250);
      }
      document.getElementById('play')?.remove();
      Module.canvas.focus();
      say('started');
      // Raceinfo::sInstance (PAL) only exists while a race scene is loaded; the title screen's
      // attract demo is a race too, which is why it must stay up for a while before counting.
      const read32 = (address) => Module._mkw_debug_read32(address) >>> 0;
      const inRace = () => read32(0x809bd730) !== 0; // System::RaceManager::s_instance
      // UI::SectionManager::s_instance (PAL): current section id, next section, top page id/state
      // (layouts from mkw-sp's Section.hh / Page.hh).
      const hex = (v) => v.toString(16);
      const menuState = () => {
        const manager = read32(0x809c1e38);
        if (!manager) return 'no section manager';
        const section = read32(manager);
        if (!section) return `no section (next ${hex(read32(manager + 0x0c))})`;
        const count = read32(section + 0x37c);
        const page = count > 0 && count <= 10 ? read32(section + 0x354 + 4 * (count - 1)) : 0;
        return `section ${hex(read32(section))} next ${hex(read32(manager + 0x0c))} state ${read32(manager + 0x30)}` +
               (page ? ` page ${hex(read32(page + 4))} pstate ${read32(page + 8)} (${count} active)` : '');
      };
      if (params.has('autoidle')) {
        // No input: the title screen cycles attract-mode demo races on different courses, which
        // exercises scene loads for as long as the page runs. Memory is logged every 30 s.
        const idleEnd = performance.now() + (Number(params.get('autoidle')) || 1800) * 1000;
        // Boot time: when the title screen's page first comes up.
        while (!/page 57 /.test(menuState()) && performance.now() < idleEnd) await sleep(100);
        say(`title screen after ${Math.round(performance.now())} ms`);
        while (performance.now() < idleEnd) {
          const js = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : -1;
          say(`idle: wasm ${Math.round(HEAP8.length / 1048576)} MiB, js ${js} MiB, disc cache ` +
              `${typeof MkwDisc !== 'undefined' ? Math.round(MkwDisc.cachedBytes / 1048576) : -1} MiB, ` +
              `${inRace() ? 'demo race' : menuState()}`);
          await sleep(30000);
        }
        say('done');
        return;
      }
      if (params.has('autowfc')) {
        // UI page ids (PAL): 0x57 title, 0x65 licence select, 0x5a main menu, 0x86 the first
        // visit's WFC permission prompt.
        const pageId = () => {
          const manager = read32(0x809c1e38);
          const section = manager ? read32(manager) : 0;
          const count = section ? read32(section + 0x37c) : 0;
          const page = count > 0 && count <= 10 ? read32(section + 0x354 + 4 * (count - 1)) : 0;
          return page ? read32(page + 4) : -1;
        };
        let confirms = Number(params.get('autowfc')) || 12;
        let lastState = '';
        for (let step = 0; step < 200 && confirms > 0; step++) {
          const state = menuState();
          if (state !== lastState) say(`at ${state}`);
          lastState = state;
          const page = pageId();
          if (page === 0x57 || page === 0x65) {
            await press('KeyX');
          } else if (page === 0x5a) {
            await press('ArrowDown');
            await sleep(600);
            await press('KeyX');
          } else if (page === 0x86) {
            // First WFC visit asks for permission; the cursor starts on "No".
            await press('ArrowUp');
            await sleep(600);
            await press('KeyX');
            confirms--;
          } else if (page !== -1 && read32(read32(read32(0x809c1e38))) !== 0x3f) {
            await press('KeyX');
            confirms--;
          }
          await sleep(2500);
        }
        say(`wfc done: ${menuState()}`);
        return;
      }
      if (params.has('autokeys')) {
        const codes = {x: 'KeyX', z: 'KeyZ', up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', enter: 'Enter'};
        await sleep(3000);
        for (const name of params.get('autokeys').split(',').map((k) => k.trim().toLowerCase())) {
          say(`${name}: ${menuState()}`);
          if (codes[name]) await press(codes[name]);
          await sleep(name === 'wait' ? 3000 : 1800);
        }
        say(`keys done: ${menuState()}`);
        return;
      }
      let presses = 0, sinceBack = 0, raceSince = 0;
      for (;;) {
        if (inRace()) {
          if (!raceSince) say(`race scene up after ${presses} presses`);
          raceSince = raceSince || performance.now();
          if (presses >= 6 && performance.now() - raceSince > 3000) break;
          if (presses < 6) { await press('KeyX'); presses++; }
          await sleep(500);
          continue;
        }
        if (raceSince) say('race scene gone');
        raceSince = 0;
        say(`press ${presses + 1}: ${menuState()}`);
        await press('KeyX');
        presses++; sinceBack++;
        await sleep(1500);
        if (sinceBack >= 16) {
          say(`no race after ${presses} presses; dumping threads and backing out`);
          Module._mkw_debug_dump_threads?.();
          await press('KeyZ'); await sleep(1500);
          sinceBack = 0;
        }
        if (presses > 60) { say('giving up'); return; }
      }
      say(`race loaded after ${presses} presses; holding accelerate`);
      if (params.has('soak')) {
        // Long-session check: keep racing (accelerate held, with taps that advance the result
        // screens into the next race) and log memory every 30 s.
        const soakEnd = performance.now() + (Number(params.get('soak')) || 1800) * 1000;
        let nextReport = 0;
        while (performance.now() < soakEnd) {
          if (performance.now() >= nextReport) {
            const js = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : -1;
            say(`soak: wasm ${Math.round(HEAP8.length / 1048576)} MiB, js ${js} MiB, ${inRace() ? 'racing' : menuState()}`);
            nextReport = performance.now() + 30000;
          }
          key('KeyX', true);
          await sleep(12000);
          key('KeyX', false);
          for (let i = 0; i < 3; i++) { await sleep(700); await press('KeyX'); }
        }
        say('done');
        return;
      }
      key('KeyX', true);
      const raceEnd = performance.now() + raceSeconds * 1000;
      if (params.has('profile') && typeof Profiler !== 'undefined') {
        // JS Self-Profiling (needs the dev server's Document-Policy header). The summary goes to
        // web-stream.log through /__logline, which the periodic log mirror does not overwrite.
        await sleep(6000);
        const profiler = new Profiler({sampleInterval: 1, maxBufferSize: 400000});
        await sleep(Number(params.get('profile')) * 1000 || 10000);
        const trace = await profiler.stop();
        const name = (i) => trace.frames[i]?.name || '(anon)';
        const self = {}, incl = {};
        let idle = 0;
        for (const sample of trace.samples) {
          if (sample.stackId === undefined) { idle++; continue; }
          const names = new Set();
          let first = true;
          for (let st = trace.stacks[sample.stackId]; st; st = st.parentId !== undefined ? trace.stacks[st.parentId] : null) {
            const n = name(st.frameId);
            if (first) { self[n] = (self[n] || 0) + 1; first = false; }
            if (!names.has(n)) { incl[n] = (incl[n] || 0) + 1; names.add(n); }
          }
        }
        // Who calls the clock: the first wasm frame below performance.now().
        const clockCallers = {};
        const clockFrame = /^(now|\(anon\)|_emscripten_get_now|_clock_time_get|.*clock_gettime.*|.*steady_clock.*|.*system_clock.*)$/;
        for (const sample of trace.samples) {
          if (sample.stackId === undefined) continue;
          let st = trace.stacks[sample.stackId];
          if (!st || !['now', '(anon)'].includes(name(st.frameId))) continue;
          while (st && clockFrame.test(name(st.frameId))) st = st.parentId !== undefined ? trace.stacks[st.parentId] : null;
          const caller = st ? name(st.frameId) : '?';
          clockCallers[caller] = (clockCallers[caller] || 0) + 1;
        }
        const total = trace.samples.length;
        const top = (o, k) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, k).map(([n, c]) => `${(100 * c / total).toFixed(1).padStart(5)}%  ${n}`);
        await fetch('/__logline', {method: 'POST', body: `== race profile: ${total} samples, idle ${(100 * idle / total).toFixed(1)}%\n-- self\n${top(self, 60).join('\n')}\n-- inclusive\n${top(incl, 60).join('\n')}\n-- clock callers\n${top(clockCallers, 20).join('\n')}\n-- inclusive, host side\n${top(Object.fromEntries(Object.entries(incl).filter(([n]) => !/^func_|^InvokeIndirect|^TryDispatch|^void Dispatch|^main$|^RuntimeMain/.test(n))), 60).join('\n')}\n`});
        say('profile written');
      }
      await sleep(Math.max(0, raceEnd - performance.now()));
      key('KeyX', false);
      say('done');
    })();
  }
  window.addEventListener('error', (e) => { const text = describe(e.error ?? e.message); mkwLog.push(`[error] ${text}`); setStatus(`Error: ${text}`); });
  window.addEventListener('unhandledrejection', (e) => { const text = describe(e.reason); mkwLog.push(`[rejection] ${text}`); setStatus(`Error: ${text}`); });
</script>
<script src="build/WiiCompiled.js"></script>
</body>
</html>
