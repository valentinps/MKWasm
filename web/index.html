<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKWasm</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px/1.4 system-ui, sans-serif; }
  /* SDL owns the canvas size (window size x devicePixelRatio); CSS sizing here would make
     SDL, ImGui and the WebGPU surface disagree about it. */
  #canvas { display: block; margin: 0 auto; outline: none; }
  #status { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; background: #000a; border-radius: 4px; white-space: pre-wrap; max-width: 80vw; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading…</div>
<script>
  // Keep the runtime's output for inspection (window.mkwLog) alongside the console.
  window.mkwLog = [];
  // Dev aid: mirror the log to the local dev server (web/serve.mjs writes web-run.log).
  if (['localhost', '127.0.0.1'].includes(location.hostname)) {
    let posted = 0;
    setInterval(() => {
      if (mkwLog.length === posted) return;
      posted = mkwLog.length;
      fetch('/__log', {method: 'POST', body: mkwLog.join('\n')}).catch(() => {});
    }, 2000);
  }
  // Dev aid (?stream): send each line with a synchronous XHR, which completes even when the
  // page's main thread never yields again (beacons and fetches would stay queued).
  const streamEnabled = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).has('stream');
  const postSync = (url, body) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, false);
    try { xhr.send(body); } catch {}
  };
  const streamLog = streamEnabled ? (text) => postSync('/__logline', text + '\n') : () => {};
  if (streamEnabled) postSync('/__logreset', '');
  const statusEl = document.getElementById('status');
  const setStatus = (text) => { statusEl.textContent = text; statusEl.hidden = !text; };

  const missing = [];
  if (!('gpu' in navigator)) missing.push('WebGPU');
  if (!('Suspending' in WebAssembly)) missing.push('WebAssembly JSPI');
  if (missing.length) {
    setStatus(`This browser lacks ${missing.join(' and ')}. Use a current Chrome or Edge.`);
    throw new Error('unsupported browser');
  }

  const DVD_ROOT = '/dvd';
  const DATA_HOME = '/userdata';
  const CONFIG = `# WiiCompiled web configuration
[video]
widescreen = true
resolution_multiplier = 1.0
frame_interpolation_fps = 0
display_mode = "windowed"
graphics_api = "auto"
show_fps = true

[audio]
mix_worker = false

[network]
enabled = false

[discord]
enabled = false

[paths]
dvd_root = "${DVD_ROOT}"
`;

  // Mirrors MEMFS changes under DATA_HOME back to IndexedDB: periodically, and whenever the
  // tab is hidden or closed (the last chance to save).
  let userDataSyncing = false;
  const persistUserData = () => {
    if (userDataSyncing || typeof FS === 'undefined') return;
    userDataSyncing = true;
    FS.syncfs(false, (error) => {
      userDataSyncing = false;
      if (error) console.warn('Saving user data failed:', error);
    });
  };
  const startUserDataSync = () => {
    setInterval(persistUserData, 5000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persistUserData(); });
    window.addEventListener('pagehide', persistUserData);
  };

  var Module = {
    canvas: document.getElementById('canvas'),
    mkwDvdRoot: DVD_ROOT,
    mkwGameUrl: 'game',
    locateFile: (name) => `build/${name}`,
    print: (text) => { mkwLog.push(text); streamLog(text); console.log(text); },
    printErr: (text) => { mkwLog.push(text); streamLog(text); console.warn(text); },
    setStatus: (text) => setStatus(text),
    preRun: [() => {
      // Game files stay on the server and are range-read on demand (mkw_web_read_file);
      // only the disc's file table and the directory skeleton live in MEMFS.
      ENV.XDG_DATA_HOME = DATA_HOME;
      // User data (Config.toml, NAND saves and licences, pipeline cache) lives in IndexedDB.
      FS.mkdirTree(DATA_HOME);
      FS.mount(IDBFS, {}, DATA_HOME);
      addRunDependency('userdata');
      FS.syncfs(true, (error) => {
        if (error) console.warn('Loading saved user data failed:', error);
        FS.mkdirTree(`${DATA_HOME}/WiiCompiled`);
        const configPath = `${DATA_HOME}/WiiCompiled/Config.toml`;
        if (!FS.analyzePath(configPath).exists) FS.writeFile(configPath, CONFIG);
        startUserDataSync();
        removeRunDependency('userdata');
      });
      FS.mkdirTree(`${DVD_ROOT}/sys`);
      FS.mkdirTree(`${DVD_ROOT}/files`);
      addRunDependency('fst');
      fetch('game/sys/fst.bin')
        .then((r) => { if (!r.ok) throw new Error(`fst.bin: HTTP ${r.status}`); return r.arrayBuffer(); })
        .then((buffer) => {
          FS.writeFile(`${DVD_ROOT}/sys/fst.bin`, new Uint8Array(buffer));
          removeRunDependency('fst');
        })
        .catch((e) => setStatus(`Failed to load the disc file table: ${e}`));
    }],
    onRuntimeInitialized: () => setStatus(''),
    onAbort: (what) => setStatus(`Aborted: ${what}`),
  };
  const describe = (e) => {
    if (e instanceof WebAssembly.Exception && Module.getExceptionMessage) {
      try { return Module.getExceptionMessage(e).join(': '); } catch {}
    }
    return e?.stack ?? e?.message ?? String(e);
  };
  window.addEventListener('error', (e) => { const text = describe(e.error ?? e.message); mkwLog.push(`[error] ${text}`); setStatus(`Error: ${text}`); });
  window.addEventListener('unhandledrejection', (e) => { const text = describe(e.reason); mkwLog.push(`[rejection] ${text}`); setStatus(`Error: ${text}`); });
</script>
<script src="build/WiiCompiled.js"></script>
</body>
</html>
